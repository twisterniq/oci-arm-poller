name: Keepalive

# GitHub disables scheduled workflows after 60 days of repository inactivity.
# This daily no-op commit keeps claim.yml's schedule enabled.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - name: Touch keepalive file
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git diff --cached --quiet || git commit -m "chore: keepalive"
          git push
